<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ doc_name }} — DocMaker</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">DocMaker</a>
            <span class="navbar-text text-white small">v0.1.0</span>
        </div>
    </nav>

    <div class="container py-4">
        <a href="/" class="mb-3 d-inline-block">&larr; Назад к каталогу</a>
        <h2>{{ doc_name }}</h2>

        <div class="alert alert-warning small" role="alert">
            ⚠️ Документ сформирован автоматически. Не является юридической консультацией.
        </div>

        <!-- Steps -->
        <div id="wizard-steps">
            <!-- Step 1: Form -->
            <div id="step-form" class="wizard-step">
                <h4 class="mt-4">Заполните данные</h4>
                <form id="form-{{ doc_type }}" class="mt-3">
                    <div id="form-fields"></div>
                    <div class="mt-3 d-flex gap-2">
                        <button type="button" class="btn btn-primary" onclick="previewDocument('{{ doc_type }}')">
                            Предпросмотр
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="downloadPdf('{{ doc_type }}')">
                            Скачать PDF
                        </button>
                        <button type="button" class="btn btn-outline-danger ms-auto" onclick="clearForm('{{ doc_type }}')">
                            Очистить
                        </button>
                    </div>
                </form>
            </div>

            <!-- Step 2: Preview -->
            <div id="step-preview" class="wizard-step" style="display:none;">
                <h4 class="mt-3">Предпросмотр</h4>
                <iframe id="pdf-preview" class="mt-3 w-100 border" style="height:80vh;"></iframe>
                <div class="mt-3 d-flex gap-2">
                    <button type="button" class="btn btn-secondary" onclick="showStep('step-form')">
                        &larr; Редактировать
                    </button>
                    <button type="button" class="btn btn-success" onclick="downloadPdf('{{ doc_type }}')">
                        Скачать PDF
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light py-3 mt-auto">
        <div class="container text-center">
            <p class="text-muted small mb-0">Документ сформирован автоматически. Не является юридической консультацией.</p>
        </div>
    </footer>

    <script src="/static/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/document-wizard.js"></script>
    <script src="/static/js/documents/{{ doc_type }}.js"></script>
    <script>
        const wizard = new DocumentWizard('{{ doc_type }}', {
            fields: window['{{ doc_type }}_FIELDS'] || []
        });
    </script>
</body>
</html>
